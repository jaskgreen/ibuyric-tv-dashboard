<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I BUY RIC — Sales Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<header>
  <div class="brand"><span class="mark">▲</span><span class="name">I BUY <b>RIC</b></span><span class="tag">SALES LEADERBOARD</span></div>
  <div class="period"><div class="pl" id="periodLabel">THIS WEEK</div><div class="dots" id="dots"></div></div>
</header>
<div class="bar"><i id="bar"></i></div>
<main id="stage">
  <div class="kpis">
    <div class="card"><div class="k">QUALIFIED LEADS</div><div class="v" id="qualifiedLeads">0</div></div>
    <div class="card"><div class="k">UNDER CONTRACT</div><div class="v" id="underContract">0</div></div>
    <div class="card"><div class="k">DEALS SOLD</div><div class="v" id="sold">0</div></div>
    <div class="card hero"><div class="k">REVENUE</div><div class="v" id="revenue">$0</div></div>
  </div>
  <div class="board">
    <div class="bt">LEADERBOARD <span>RANKED BY DEALS SOLD</span></div>
    <div id="rows"></div>
  </div>
</main>
<footer id="foot"></footer>
<script src="app.js"></script>
</body>
</html>
